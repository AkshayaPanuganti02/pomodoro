# --- Database (PostgreSQL) ---
# Set these as real environment variables when deploying. Never commit real
# credentials to source control.
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/pomodoro}
spring.datasource.username=${DATABASE_USERNAME:postgres}
spring.datasource.password=${DATABASE_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false

# --- JWT ---
# MUST be overridden with a long, random, secret value in production
# (e.g. `openssl rand -base64 48`). At least 32 bytes.
app.jwt.secret=${JWT_SECRET:CHANGE_ME_TO_A_LONG_RANDOM_SECRET_BEFORE_DEPLOYING}
# 7 days, in milliseconds
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:604800000}

# --- CORS ---
# Comma-separated list of allowed frontend origins. Set this to your real
# Netlify/GitHub Pages URL(s) in production - do not leave this wide open.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# --- Misc ---
server.port=${PORT:8080}
spring.web.resources.add-mappings=false
