<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pomodoro</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div id="ambienceBackground"></div>

    <main class="app">

        <section class="timer-section">

    <p class="session-type" id="sessionType">
        FOCUS
    </p>

    <p
    id="activeTask"
    class="active-task"
>
</p>

    <div class="timer" id="timer">
        25:00
    </div>

    <div class="timer-controls">

    <button id="startButton" class="start-button">
        ▶ Start
    </button>

    <button id="resetButton" class="reset-button">
        ↻ Reset
    </button>

</div>

    <p class="session-count" id="sessionProgress">
    Session 1 of 4
</p>

</section>


        <section class="todo-section">

    <h2>Tasks</h2>

    <div class="date-nav" id="dateNav">
        <button id="prevDateButton" class="date-nav-button" aria-label="Previous day">‹</button>
        <button id="dateLabel" class="date-label" title="Jump to today">Today</button>
        <button id="nextDateButton" class="date-nav-button" aria-label="Next day">›</button>
    </div>

    <div class="task-list" id="taskList">
        <!-- Tasks will be created dynamically -->
    </div>

    <div class="add-task-container">

        <input
            type="text"
            id="taskInput"
            placeholder="What do you need to do?"
        >

        <button id="addTaskButton">
            + Add task
        </button>

    </div>

</section>

<button
    id="ambienceButton"
    class="ambience-button"
    aria-label="Open ambience"
>
    🌿
</button>

<button
    id="stickyNotesButton"
    class="sticky-notes-button"
    aria-label="Open sticky notes"
>
    🗒️
</button>

<div id="stickyNotesContainer"></div>

<button
    id="settingsButton"
    class="settings-button"
    aria-label="Open timer settings"
>
    ⚙️
</button>


<section
    id="settingsPanel"
    class="settings-panel"
>

    <div class="settings-header">

        <h2>Timer Settings</h2>

        <button
            id="closeSettingsButton"
            class="close-settings-button"
            aria-label="Close timer settings"
        >
            ×
        </button>

    </div>


    <div class="setting">

        <label for="focusDuration">
            Focus duration
        </label>

        <input
            type="number"
            id="focusDuration"
            min="1"
            value="25"
        >

        <span>minutes</span>

    </div>


    <div class="setting">

        <label for="shortBreakDuration">
            Short break
        </label>

        <input
            type="number"
            id="shortBreakDuration"
            min="1"
            value="5"
        >

        <span>minutes</span>

    </div>


    <div class="setting">

        <label for="longBreakDuration">
            Long break
        </label>

        <input
            type="number"
            id="longBreakDuration"
            min="1"
            value="15"
        >

        <span>minutes</span>

    </div>


    <div class="setting">

        <label for="sessionsUntilLongBreak">
            Sessions until long break
        </label>

        <input
            type="number"
            id="sessionsUntilLongBreak"
            min="1"
            value="4"
        >

        <span>sessions</span>

    </div>


    <button
        id="saveSettingsButton"
        class="save-settings-button"
    >
        Save Settings
    </button>

</section>

</section> <!-- settingsPanel -->

<button
    id="accountButton"
    class="account-button"
    aria-label="Account"
>
    👤
</button>

<section
    id="authPanel"
    class="auth-panel"
>
    <div class="auth-header">
        <h2 id="authTitle">Log In</h2>
        <button id="closeAuthButton" class="close-auth-button" aria-label="Close">×</button>
    </div>

    <div id="authLoggedOutView">

        <p id="authError" class="auth-error"></p>

        <input type="email" id="authEmail" class="auth-input" placeholder="Email">
        <input type="password" id="authPassword" class="auth-input" placeholder="Password (min 8 characters)">

        <button id="authSubmitButton" class="auth-submit-button">Log In</button>

        <p class="auth-toggle">
            <span id="authToggleText">Don't have an account?</span>
            <button id="authToggleButton" class="auth-toggle-button">Sign up</button>
        </p>

        <p class="auth-note">Tasks stay on this device until you log in. Once logged in, they sync across devices.</p>
    </div>

    <div id="authLoggedInView" class="auth-logged-in-view">
        <p>Signed in as <strong id="authUserEmail"></strong></p>
        <button id="logoutButton" class="auth-submit-button">Log Out</button>
    </div>

</section>

<section
    id="ambiencePanel"
    class="ambience-panel"
>

    <div class="ambience-header">

        <h2>Ambience</h2>

        <button
            id="closeAmbienceButton"
            class="close-ambience-button"
            aria-label="Close ambience"
        >
            ×
        </button>

    </div>

    <div
        id="ambienceList"
        class="ambience-list"
    ></div>

</section>

    </main>


    <script src="script.js"></script>


</body>
</html>
